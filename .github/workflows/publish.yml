name: publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: extract versions from gradle.properties
        id: version
        run: |
          echo "version=$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' \r')" >> "$GITHUB_OUTPUT"
          echo "overlaylib_version=$(grep -m1 '^overlaylib_version=' gradle.properties | cut -d= -f2 | tr -d ' \r')" >> "$GITHUB_OUTPUT"

      - name: check if version already released
        id: check-version
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Version $TAG already released (tag found). Skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $TAG not found. Proceeding with publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        if: steps.check-version.outputs.exists != 'true'
        run: ./gradlew build

      - name: publish
        id: publish
        if: steps.check-version.outputs.exists != 'true'
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: lightoverlay
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1376481
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: v${{ steps.version.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: Light Overlay ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog-file: RELEASE_NOTES.md

          files: build/libs/!(*-@(dev|sources|javadoc)).jar

      - name: pin overlaylib version on Modrinth
        if: steps.check-version.outputs.exists != 'true' && steps.version.outputs.overlaylib_version != '' && steps.publish.outputs.modrinth-version != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check requests packaging
          python3 .github/scripts/pin_overlaylib.py \
            --version-id "${{ steps.publish.outputs.modrinth-version }}" \
            --overlaylib-version "${{ steps.version.outputs.overlaylib_version }}"